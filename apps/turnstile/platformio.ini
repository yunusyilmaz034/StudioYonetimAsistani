; TURNİKE FIRMWARE — Perkotek S310 + ESP32-S3-DevKitC-1
;
; Bir C++ projesi, pnpm workspace'inin dışında (package.json yok) — `pnpm check` buraya bakmaz.
; Derlemesi ayrı komut, ve kasıtlı: bu kod panelle aynı anda değişmez, aynı anda deploy edilmez.
;
;   pio run                 derle
;   pio run -t upload       karta at
;   pio device monitor      seri çıktı
[env:esp32-s3-devkitc-1]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; N16R8 modül: 16MB flash, 8MB octal PSRAM. Yanlış ayar açılışta boot loop demek.
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
build_flags =
    ; NEREDEN LOG AKIYOR (2026-08-28'de değişti: 0 → 1).
    ;
    ; 0 = `Serial` UART0'a, yani CH343 köprüsünün olduğu porta gider. Bu makinede o köprü macOS'ta
    ; HİÇ görünmüyor (WCH sürücüsü yok) — `ls /dev/cu.*` yalnızca native USB'nin `usbmodem`'ini
    ; listeliyor. Yani 0 ayarında seri çıktı var olmayan bir porta akıyordu ve bir günü kartın
    ; açılıp açılmadığını göremeden geçirdik.
    ;
    ; 1 = `Serial` native USB'ye gider — bu Mac'in gördüğü tek port. Kapı cihazının üretimde seri
    ; çıktıya ihtiyacı yok; bu ayar yalnızca teşhis edilebilirliği belirliyor, davranışı değil.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM

lib_deps =
    adafruit/Adafruit ILI9341@^1.6.1
    adafruit/Adafruit GFX Library@^1.11.9
    ricmoo/QRCode@^0.0.1
