# Firebase App Hosting — the deploy target for the Next.js app (owner decision, 2026-07-13).
#
# Two things this file is careful about:
#
#   • A SECRET is never a `value`. `secret:` names an entry in Google Secret Manager and is
#     injected at RUNTIME only; it never enters the build, never reaches the browser bundle, and
#     never appears in this repository. A key committed to git is a key that has leaked, and the
#     only honest response to a leaked key is to rotate it — which is why `secrets.ts` refuses to
#     start without one rather than falling back to a value we published (DEBT-013).
#
#   • Anything prefixed `NEXT_PUBLIC_` IS PUBLIC. It is compiled into the browser bundle. Nothing
#     may be put there that we would mind a member reading — the Firebase web config is an
#     identifier, not a credential, and that is why it is allowed to be here.
#
# App Hosting builds from git; there is no `firebase deploy --only hosting`. The backend's
# root directory (this repo root) and its branch are configured once, on the backend itself.

# ── BUILD & RUN (2026-07-14) ─────────────────────────────────────────────────────────────────
#
# App Hosting has no pnpm-workspace-aware install. Pointed at `apps/web` it looks for a lockfile
# there — and in a pnpm workspace there will never be one: pnpm keeps exactly ONE lockfile, at the
# workspace root, on purpose.
#
# So the backend's Root Directory is the REPO ROOT, where `pnpm-lock.yaml` is. That fixes the install
# (the workspace resolves, and `@studio/core` links) but leaves App Hosting unable to detect a
# framework: the root `package.json` has no `next` and no `build`/`start`. These two lines tell it
# what to do instead. It is the documented way to opt out of framework detection.
#
# NOTHING ELSE CHANGES: not the code, not `next.config.mjs`, not the workspace, not the folders.
scripts:
  buildCommand: pnpm --filter web build
  runCommand: pnpm --filter web start

runConfig:
  # `minInstances: 1` since 2026-08-14, and the note this replaces asked to revisit it "not on a
  # guess". This is the measurement: on one ordinary day the panel's first request took 12.35s,
  # 12.20s and 12.31s — three times, hours apart. That is not "the first request of the morning";
  # the container scales to zero during every quiet stretch, and reception pays twelve seconds each
  # time she comes back to it. Warm requests were 0.22s, so nothing here is slow except being born.
  #
  # One always-on instance costs a few dollars a month. Twelve seconds, several times a day, in
  # front of a member standing at the desk, costs more than that.
  minInstances: 1
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # ── Public: compiled into the browser bundle, on purpose ──────────────────────────────────
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: studio-yonetim-prod
    availability:
      - BUILD
      - RUNTIME

  # The Firebase web config (hotfix B-1). An `apiKey` here is an IDENTIFIER, not a credential: it
  # names the project at Google's front door, and what protects the data is Auth + the security rules.
  # Without these two the client SDK cannot sign anybody in — which is what production would have done
  # on the first morning of the pilot, because they used to be hardcoded to the emulator's demo values.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBYCZEFu-oxit5J9h_pgNnEfCyYyud1b0s
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: studio-yonetim-prod.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  # The private-media bucket (v1.28). Progress photos and signed member documents live here; nothing is
  # public (reads are server-minted signed URLs, storage.rules denies client reads). The name is an
  # IDENTIFIER, not a secret. Setting it flips `storageConfigured()` to true so the upload UI works
  # instead of degrading to "yükleme yapılandırılmamış". BUILD too: the client SDK reads it at build.
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: studio-yonetim-prod.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  # ── Server-side, not secret ───────────────────────────────────────────────────────────────
  - variable: FIREBASE_PROJECT_ID
    value: studio-yonetim-prod
    availability:
      - RUNTIME

  # ── E-mail: the key belongs to whoever READS it, and now BOTH tiers do ────────────────────
  #
  # These two were declared here once when only Cloud Functions read them — so the key sat in a
  # process that never used it, the functions found `undefined`, the provider fell back to the
  # console, and every message the studio believed it had sent was written to a log and thrown away.
  # Silently, with a green deploy. They were moved to the functions, where the sending code lives.
  #
  # They are back because the WEB tier now sends one e-mail of its own: the staff password reset
  # (`server/actions/password-reset.ts`). Firebase's built-in reset mail cannot be used — it sends
  # from `noreply@<project>.firebaseapp.com`, a domain with no SPF and no DKIM, and we watched Gmail
  # swallow one without a trace. A reset link that never arrives is not a reset flow.
  #
  # The functions keep their OWN copies (`apps/functions/.env.studio-yonetim-prod` + the `secrets:`
  # declaration in `shared/region.ts`). Two tiers, two runtimes, two declarations — deleting either
  # side silently disables sending in that tier and nowhere else.
  - variable: EMAIL_FROM
    value: noreply@pilatesfitnessbyisil.com
    availability:
      - RUNTIME

  # WhatsApp (Meta Cloud API, 2026-07-20). Phone Number ID is an identifier; the token is the secret
  # below. The web tier sends WhatsApp on the manual/bulk "Stüdyodan" + notification-center paths.
  - variable: WHATSAPP_PHONE_NUMBER_ID
    value: "1153884641150592"
    availability:
      - RUNTIME

  # The panel's own public origin (online üyelik satışı, blok 2c). The callback builds the buyer's
  # invite link from it. An identifier, not a credential. The functions keep their own copy
  # (`apps/functions/.env.studio-yonetim-prod`) — that tier serves the LIVE callback.
  - variable: PUBLIC_APP_URL
    value: https://panel.pilatesfitnessbyisil.com
    availability:
      - RUNTIME

  # ── Secrets: Secret Manager, runtime only, never in this file ─────────────────────────────
  - variable: WHATSAPP_ACCESS_TOKEN
    secret: WHATSAPP_ACCESS_TOKEN
    availability:
      - RUNTIME
  # Provision with:  firebase apphosting:secrets:set qr-token-secret --project <prod>
  - variable: QR_TOKEN_SECRET
    secret: qr-token-secret
    availability:
      - RUNTIME

  # Set ONLY during a key rotation, and removed once the sixty-second TTL has passed. While it is
  # present, tokens minted under the outgoing key still verify — so a rotation costs no failed
  # scans at the door (DEBT-013, `secrets.ts`).
  # - variable: QR_TOKEN_SECRET_PREVIOUS
  #   secret: qr-token-secret-previous
  #   availability:
  #     - RUNTIME

  # The staff password-reset mail. Same Secret Manager secret the functions read (rotated 2026-07-14,
  # version 2) — one key, one place, two consumers.
  # ── TAMI (2026-08-17) ──────────────────────────────────────────────────────────────────────
  # Absent until the merchant account is approved, and absence is SAFE: without the secret key the
  # adapter is Unconfigured and every flow says configuration_required rather than pretending.
  # Without the JWK a checkout can still be minted but nothing can be confirmed — so a payment can be
  # started and never completed, which is the correct half to be missing.
  # Provisioned 2026-08-19, the day the merchant account was approved. All three are present, so
  # `tamiReadiness().canConfirm` is true and the settings screen will let TAMI be selected.
  - variable: TAMI_SECRET_KEY
    secret: TAMI_SECRET_KEY
    availability: [RUNTIME]
  - variable: TAMI_JWK_KID
    secret: TAMI_JWK_KID
    availability: [RUNTIME]
  - variable: TAMI_JWK_K
    secret: TAMI_JWK_K
    availability: [RUNTIME]

  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
  # ── PAYTR (Plus Phase 6) — the merchant key + salt sign every token and verify every callback. The
  # web tier verifies callbacks and starts checkouts, so it reads both. RUNTIME only — a secret must
  # never be exposed at build. Merchant id is NOT a secret; it lives in the payment-provider settings doc.
  - variable: PAYTR_MERCHANT_KEY
    secret: PAYTR_MERCHANT_KEY
    availability:
      - RUNTIME
  - variable: PAYTR_MERCHANT_SALT
    secret: PAYTR_MERCHANT_SALT
    availability:
      - RUNTIME

  # ── Anthropic (Faz 2) — the LLM behind the dashboard "bugün ilgilenmen gerekenler" AI checklist (and,
  # later, the AI receptionist). Usage-based; RUNTIME only. With the secret absent the AI layer returns
  # null and the deterministic list is shown, so a missing key degrades gracefully rather than breaking.
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability:
      - RUNTIME
